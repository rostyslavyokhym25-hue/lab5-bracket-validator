[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bracket-validator-Rostyk"
version = "0.1.0"
description = "Bracket balance validator with stack and position reporting"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
bracket-validator = "bracket_validator.validator:main"

[tool.setuptools.packages.find]
where = ["src"]